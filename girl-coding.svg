<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="glow" cx="0.7" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#00ffcc" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00ffcc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="320" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect width="400" height="320" rx="14" fill="url(#glow)"/>

  <!-- floating particles -->
  <circle cx="40" cy="60" r="3" fill="#00ffcc" opacity="0.5">
    <animate attributeName="cy" values="60;48;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="90" r="2.5" fill="#00ffcc" opacity="0.4">
    <animate attributeName="cy" values="90;78;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="250" r="2.5" fill="#8b949e" opacity="0.4">
    <animate attributeName="cy" values="250;240;250" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <text x="352" y="52" fill="#00ffcc" font-size="16" opacity="0.55" font-weight="bold">&lt;/&gt;
    <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.6s" repeatCount="indefinite"/>
  </text>

  <!-- desk -->
  <rect x="24" y="252" width="352" height="9" rx="4.5" fill="#243447"/>

  <!-- laptop screen -->
  <rect x="238" y="140" width="128" height="96" rx="8" fill="#0a1420" stroke="#00ffcc" stroke-width="2"/>
  <g>
    <rect x="250" y="154" width="70" height="6" rx="3" fill="#00ffcc" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="250" y="168" width="100" height="6" rx="3" fill="#8b949e" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.15;0.85;1" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="250" y="182" width="84" height="6" rx="3" fill="#00ffcc" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="250" y="196" width="96" height="6" rx="3" fill="#8b949e" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.15;0.85;1" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="250" y="210" width="60" height="6" rx="3" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- laptop base -->
  <rect x="230" y="236" width="144" height="12" rx="6" fill="#1c2a3a"/>

  <!-- coffee -->
  <rect x="196" y="222" width="20" height="28" rx="4" fill="#8b949e"/>
  <rect x="196" y="222" width="20" height="8" rx="4" fill="#6e7681"/>
  <path d="M206 214 q4 -6 0 -12 q-4 -6 0 -12" stroke="#8b949e" stroke-width="2.5" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- girl: back hair -->
  <ellipse cx="104" cy="168" rx="34" ry="46" fill="#3a2b5c"/>
  <!-- ponytail -->
  <ellipse cx="96" cy="212" rx="13" ry="28" fill="#3a2b5c"/>
  <!-- neck -->
  <rect x="128" y="182" width="16" height="22" fill="#f2c9a0"/>
  <!-- body/top -->
  <rect x="104" y="202" width="68" height="54" rx="18" fill="#00d4b8"/>
  <!-- head -->
  <circle cx="138" cy="160" r="23" fill="#f2c9a0"/>
  <!-- front hair cap -->
  <path d="M115 158 a23 23 0 0 1 46 0 l0 -8 a23 23 0 0 0 -46 0 z" fill="#3a2b5c"/>
  <circle cx="115" cy="166" r="7" fill="#3a2b5c"/>
  <!-- face -->
  <circle cx="147" cy="158" r="2.6" fill="#0d1117"/>
  <path d="M152 168 q6 4 11 1" stroke="#0d1117" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="140" cy="166" r="3.5" fill="#ff9d9d" opacity="0.55"/>

  <!-- arm typing (animated) -->
  <g>
    <line x1="162" y1="218" x2="238" y2="232" stroke="#f2c9a0" stroke-width="14" stroke-linecap="round"/>
    <circle cx="240" cy="232" r="9" fill="#f2c9a0"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 3; 0 0" dur="0.9s" repeatCount="indefinite"/>
  </g>
</svg>
